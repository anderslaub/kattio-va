<!doctype html>
<!-- Preview of the page outside Home Assistant: a fake connection that streams a canned reply.
     npm run build, then open this file (or: chromium --headless --screenshot ... preview/index.html) -->
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  html, body { margin: 0; height: 100%; }
  :root {
    --primary-color: #03a9f4; --primary-background-color: #fafafa; --card-background-color: #fff;
    --primary-text-color: #212121; --secondary-text-color: #727272; --divider-color: rgba(0,0,0,.12);
    --secondary-background-color: #eceff1; font-family: Roboto, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root { --primary-background-color: #111; --card-background-color: #1c1c1c; --primary-text-color: #e1e1e1;
      --secondary-text-color: #9b9b9b; --divider-color: rgba(225,225,225,.12); --secondary-background-color: #282828; }
  }
</style>
<script>
  // Stand-ins for Home Assistant's own elements
  customElements.define("ha-icon", class extends HTMLElement {
    connectedCallback() { this.style.display = "inline-block"; this.textContent = { "mdi:cat": "🐱", "mdi:send": "➤",
      "mdi:plus": "+", "mdi:microphone": "🎤", "mdi:message-plus-outline": "✚" }[this.getAttribute("icon")] || "?";
      this.style.fontSize = "var(--mdc-icon-size, 24px)"; this.style.lineHeight = "1"; }
  });
  customElements.define("ha-menu-button", class extends HTMLElement {
    connectedCallback() { this.textContent = "☰"; this.style.cssText = "font-size:22px;padding:0 12px"; }
  });
  const reply = ["Sure, ", "the kitchen lights ", "are on now.", "\u0000", "Anything else?"];
  window.fakeHass = {
    user: { id: "u1", name: "Test" },
    connection: {
      async subscribeMessage(cb, msg) {
        let i = 0;
        const t = setInterval(() => {
          if (i === 0) cb({ type: "run-start", data: {} });
          if (i < reply.length) {
            const part = reply[i];
            cb({ type: "intent-progress", data: { chat_log_delta: part === "\u0000" ? { role: "assistant" } : { content: part } } });
          } else {
            cb({ type: "intent-end", data: { intent_output: { conversation_id: "c1", response: { response_type: "action_done", speech: { plain: { speech: "Anything else?" } } } } } });
            cb({ type: "run-end", data: {} });
            clearInterval(t);
          }
          i++;
        }, 150);
        return async () => {};
      },
    },
  };
</script>
<script type="module" src="../../custom_components/kattio/www/kattio-panel.js"></script>
</head>
<body>
<kattio-panel></kattio-panel>
<script type="module">
  const el = document.querySelector("kattio-panel");
  el.hass = window.fakeHass;
  el.narrow = true;
  el.panel = { config: { title: "Kattio", pipeline: null, users: [] } };
  const p = new URLSearchParams(location.search);
  if (p.get("ask")) {
    await customElements.whenDefined("kattio-panel");
    await el.updateComplete;
    el._draft = p.get("ask");
    await el.updateComplete;
    el._send();
  }
</script>
</body>
</html>
