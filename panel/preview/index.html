  const svg = (path, size) => '<svg viewBox="0 0 24 24" width="' + size + '" height="' + size + '" style="display:block"><path fill="currentColor" d="' + path + '"/></svg>';

    static observedAttributes = ["icon"];
    attributeChangedCallback() { if (this.isConnected) this.connectedCallback(); }
    connectedCallback() {
      const size = getComputedStyle(this).getPropertyValue("--mdc-icon-size").trim() || "24px";
      this.style.display = "inline-block";
      this.innerHTML = svg(ICONS[this.getAttribute("icon")] || "", size);
    }
  });
  customElements.define("ha-menu-button", class extends HTMLElement {
    connectedCallback() {
      this.style.cssText = "display:inline-flex;width:48px;height:48px;align-items:center;justify-content:center";
      this.innerHTML = svg(ICONS["mdi:menu"], "24px");
    }
  });
  const params = new URLSearchParams(location.search);
  const long = params.get("long") === "1";
  const reply = long
    ? Array.from({ length: 60 }, (_, i) => (i % 12 === 11 ? "\n\n" : "") + "Here is a longer answer, word by word, ")
    : ["Sure, ", "the kitchen lights ", "are on now.", "\u0000", "Anything else?"];
  // the pretend spoken answer: 2 s of a tone that swells, as a wav
  function toneWav() {
    const rate = 16000, n = rate * 2, b = new DataView(new ArrayBuffer(44 + n * 2));
    const str = (o, t) => [...t].forEach((c, i) => b.setUint8(o + i, c.charCodeAt(0)));
    str(0, "RIFF"); b.setUint32(4, 36 + n * 2, true); str(8, "WAVEfmt "); b.setUint32(16, 16, true);
    b.setUint16(20, 1, true); b.setUint16(22, 1, true); b.setUint32(24, rate, true); b.setUint32(28, rate * 2, true);
    b.setUint16(32, 2, true); b.setUint16(34, 16, true); str(36, "data"); b.setUint32(40, n * 2, true);
    for (let i = 0; i < n; i++) b.setInt16(44 + i * 2, Math.sin(i / rate * 2 * Math.PI * 220) * Math.abs(Math.sin(i / rate * 9)) * 9000, true);
    let bin = ""; new Uint8Array(b.buffer).forEach((x) => (bin += String.fromCharCode(x)));
    return "data:audio/wav;base64," + btoa(bin);
  }
  window.micBytes = 0;
  const now = Date.now() / 1000;
  window.fakeHistory = {
    h1: { user: "u1", title: "Turn on the lights in the living room", updated: now - 3600 * 3, messages: [

    h2: { user: "u1", title: "What should I cook tonight?", updated: now - 86400 * 1.2, messages: [
      { role: "user", text: "What should I cook tonight?" }, { role: "assistant", text: "How about a quick risotto? You have mushrooms and parmesan." },

    e1: { user: "u2", title: "Can you help with my homework?", updated: now - 1800, messages: [
      { role: "user", text: "Can you help with my homework?" }, { role: "assistant", text: "Of course! What is it about?" }] },
  };
  window.fakeHass = {
    user: { id: "u1", name: "Test", is_admin: params.get("admin") !== "0" },
    // the Kattio integration's history, in memory (two of your own, one of someone else's)
    async callWS(msg) {
      const h = window.fakeHistory;
      const sum = (id, c) => ({ id, title: c.title, updated: c.updated, count: c.messages.length, user_id: c.user, user_name: c.user === "u1" ? "Test" : "Emma", mine: c.user === "u1" });
      const mine = () => Object.entries(h).filter(([, c]) => c.user === "u1").sort((a, b) => b[1].updated - a[1].updated);
      switch (msg.type) {
        case "kattio/history/list":
          return { conversations: (msg.everyone ? Object.entries(h).sort((a, b) => b[1].updated - a[1].updated) : mine()).map(([id, c]) => sum(id, c)) };
        case "kattio/history/get": {
          const id = msg.conversation_id || mine()[0]?.[0];
          return id && h[id] ? { ...sum(id, h[id]), messages: h[id].messages } : null;
        }
        case "kattio/history/save": {
          const old = h[msg.conversation_id];
          h[msg.conversation_id] = { user: "u1", title: old?.title || msg.messages.find((m) => m.role === "user")?.text || "", updated: Date.now() / 1000, messages: msg.messages };
          return null;
        }
        case "kattio/history/delete":
          delete h[msg.conversation_id];
          return null;
      }
      throw { code: "unknown_command", message: "Unknown command." };
    },
    themes: { darkMode: params.get("dark") === "1" },
    connection: {
      socket: { readyState: 1, send(b) { window.micBytes += b.length; } },
      async subscribeMessage(cb, msg) {
        let i = 0;
        if (msg.start_stage === "stt") {
          const url = toneWav();
          cb({ type: "run-start", data: { runner_data: { stt_binary_handler_id: 1 }, tts_output: { url, stream_response: true } } });
          setTimeout(() => {
            cb({ type: "stt-vad-end", data: {} });
            cb({ type: "stt-end", data: { stt_output: { text: params.get("heard") ?? "What's the weather tomorrow?" } } });
            if (params.get("heard") === "") { cb({ type: "error", data: { code: "stt-no-text-recognized" } }); return; }
            cb({ type: "intent-progress", data: { chat_log_delta: { role: "assistant" } } });
            cb({ type: "intent-progress", data: { tts_start_streaming: true } });
            const words = ["Cloudy ", "in the morning, ", "some sun ", "after lunch."];
            words.forEach((w, k) => setTimeout(() => cb({ type: "intent-progress", data: { chat_log_delta: { content: w } } }), 200 * k));
            setTimeout(() => {
              cb({ type: "intent-end", data: { intent_output: { conversation_id: msg.conversation_id || "c" + Date.now(), response: { response_type: "action_done", speech: { plain: { speech: words.join("") } } } } } });
              cb({ type: "tts-end", data: { tts_output: { url } } });
              cb({ type: "run-end", data: {} });
            }, 1000);
          }, 1500);
          return async () => {};
        }
        const t = setInterval(() => {
          if (i === 0) cb({ type: "run-start", data: {} });
          if (i < reply.length) {
            const part = reply[i];
            cb({ type: "intent-progress", data: { chat_log_delta: part === "\u0000" ? { role: "assistant" } : { content: part } } });
          } else {
            cb({ type: "intent-end", data: { intent_output: { conversation_id: msg.conversation_id || "c" + Date.now(), response: { response_type: "action_done", speech: { plain: { speech: "Anything else?" } } } } } });
            cb({ type: "run-end", data: {} });
            clearInterval(t);
          }
          i++;
        }, 150);
        return async () => {};
      },
    },
  };
  try {
    sessionStorage.removeItem("kattio-panel:conversation:v1");

<script type="module">
  const el = document.querySelector("kattio-panel");
  el.hass = window.fakeHass;
  el.narrow = innerWidth < 870;
  el.panel = { config: { title: "Kattio", pipeline: null, users: [] } };
  await customElements.whenDefined("kattio-panel");
  await el.updateComplete;
  if (params.get("settings") === "1") el._settingsOpen = true;
  if (params.get("ask")) {
    el._draft = params.get("ask");
    await el.updateComplete;
    el._send();
  }
