# Audio hardware, full duplex: the box listens while it speaks, with echo cancellation.
#
# esphome-audio-stack (MIT, https://github.com/n-IA-hane/esphome-audio-stack) owns the shared I2S bus: the
# ES7210 microphone ADC and the ES8311 speaker DAC run at the same time on a 48 kHz bus, the microphone is
# converted to 16 kHz. On the ESP32-S3-BOX-3 the speaker signal is wired back into the ES7210 (MIC3), so the echo
# canceller gets the real speaker output as its reference (TDM slot 1; the voice microphone is MIC1, slot 0).
# Slot map and gains as validated on a BOX-3 by the community (maxi1134's Home-Assistant-Config, June 2026).
#
# The audio task runs on core 0 (with Wi-Fi); the ESPHome loop, LVGL face and wake word run on core 1.

external_components:
  - source: github://n-IA-hane/esphome-audio-stack@v2026.11.0
    components: [esp_audio_stack, esp_aec]

esp32:
  framework:
    sdkconfig_options:
      # The audio stack's libraries allocate with plain malloc: large blocks go to PSRAM, internal RAM stays
      # free for DMA, Wi-Fi and the display
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: "y"
      CONFIG_SPIRAM_RODATA: "y"
      CONFIG_MBEDTLS_EXTERNAL_MEM_ALLOC: "y"
      CONFIG_SPIRAM_USE_CAPS_ALLOC: "n"
      CONFIG_SPIRAM_USE_MALLOC: "y"
      CONFIG_SPIRAM_MALLOC_ALWAYSINTERNAL: "4096"
      CONFIG_SPIRAM_MALLOC_RESERVE_INTERNAL: "65536"
      CONFIG_SPIRAM_TRY_ALLOCATE_WIFI_LWIP: "y"

esp_aec:
  id: aec
  sample_rate: 16000
  filter_length: 4
  # linear echo cancellation only: keeps the sound features the wake word model relies on
  mode: sr_low_cost

esp_audio_stack:
  id: audio_stack
  i2s_lrclk_pin: GPIO45
  i2s_bclk_pin: GPIO17
  i2s_mclk_pin: GPIO2
  i2s_din_pin: GPIO16
  i2s_dout_pin: GPIO15
  sample_rate: 48000
  output_sample_rate: 16000
  slot_bit_width: 16
  bits_per_sample: 16
  correct_dc_offset: true
  processor_id: aec
  codec:
    i2c_id: i2c_bus
    input:
      type: es7210
      address: 0x40
      mic_selected: 0x0F
      # +9 dB over the usual 24 dB, as with the half-duplex setup: the wake word across the room
      gain_db: 33.0
      ref_channel: 2  # MIC3 carries the speaker signal
      ref_gain_db: 0.0
    output:
      type: es8311
      address: 0x18
      use_mclk: true
      no_dac_ref: true
  use_tdm_reference: true
  tdm_total_slots: 4
  tdm_mic_slots: [0]  # MIC1
  tdm_ref_slot: 1  # MIC3 (the ES7210 puts its inputs on the slots as MIC1, MIC3, MIC2, MIC4)
  buffers_in_psram: true
  audio_task_stack_in_psram: true

microphone:
  - platform: esp_audio_stack
    id: box_mic

speaker:
  - platform: esp_audio_stack
    id: box_speaker
    # short, so the face's lip sync (metered before this buffer) stays close to what is heard
    buffer_duration: 150ms

switch:
  - platform: esp_audio_stack
    aec:
      name: Echo cancellation
      entity_category: config
      restore_mode: RESTORE_DEFAULT_ON

globals:
  # the box listens while it speaks: the wake word (and "Stop") keep running during playback
  - id: full_duplex
    type: bool
    initial_value: "true"
