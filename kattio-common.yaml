---
# Kattio - an expressive cat face voice assistant for the ESP32-S3-BOX-3
#
#  * The face is drawn procedurally (anti-aliased vector shapes, no bitmaps) by the local
#    `kattio_face` component and reacts to the voice assistant state.
#  * On-device wake word "Hey Kattio" (microWakeWord) + "Stop" during multi-turn conversations.
#  * Voice enhancer between the media player and the speaker: EQ for the tiny speaker,
#    loudness boost with limiter, and lip-sync level metering.
#
# Hardware note: on the BOX-3 the microphone and the speaker share one I2S bus, so the mic
# can't listen while the speaker plays. Tap the screen to interrupt the cat while it talks.

# Shared by all boxes: build kattio-box-1.yaml / kattio-box-2.yaml, which set the name.
substitutions:
  name: kattio-box
  friendly_name: Kattio Box
  # Two wake words, each can run its own HA assistant: set "Wake word"/"Assistant" and "Wake word 2"/
  # "Assistant 2" on the device in HA (e.g. Hey Kattio -> HA intents, Okay Kattio -> pi).
  # Models come from wakewords/<name>/latest.* via tools/sync_wakewords.py
  wake_word_model: wakewords/hey_kattio/esphome/hey_kattio.json
  wake_word_2_model: wakewords/okay_kattio/esphome/okay_kattio.json
  # Turn detection service ("host" or "host:port", UDP, default port 10330): the default for the "Turn detection
  # server" setting in HA. Empty: none until it is set there (no reflash needed).
  turn_server: ""
  # Petting: the cat snaps (growl + claw marks) at 1 in this many pets; 0 = never. Also adjustable in HA.
  snap_one_in: "4"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  min_version: 2026.4.0
  on_boot:
    priority: -100
    then:
      - lambda: id(voice_out).set_timing_log(id(timing_log).state);
  project:
    name: kattio.cat-box
    version: "1.0.0"

esp32:
  board: esp32s3box
  flash_size: 16MB
  cpu_frequency: 240MHz
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESP32S3_DEFAULT_CPU_FREQ_240: "y"
      CONFIG_ESP32S3_DATA_CACHE_64KB: "y"
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: "y"

psram:
  mode: octal
  speed: 80MHz

external_components:
  - source:
      type: local
      path: components

logger:
  hardware_uart: USB_SERIAL_JTAG

api:
  encryption:
    key: !secret api_encryption_key
  on_client_connected:
    - lambda: id(face).set_connected(true);
  # Any API client counts (Home Assistant, but also a log viewer): only go "offline" when none is left, or
  # closing `esphome logs` would show the offline face while Home Assistant is still connected
  on_client_disconnected:
    - delay: 500ms
    - if:
        condition:
          not:
            api.connected:
        then:
          - lambda: id(face).set_connected(false);
  actions:
    # Called by the Pi Agent integration while pi works on a task in the background (and when it is done):
    # the cat shows the "working" face instead of waiting for an answer
    - action: pi_agent_working
      variables:
        working: bool
      then:
        - lambda: |-
            ESP_LOGI("kattio", "pi is %s", working ? "working" : "done");
            if (working) {
              id(pi_working) = true;
              id(pi_working_since) = millis();
            } else if (id(pi_working)) {
              id(pi_working) = false;
              // In chat mode, listen again after the result has been announced
              if (id(chat_mode)) {
                id(resume_after_announce) = true;
                id(resume_since) = millis();
              }
            }
        - script.execute: show_working
    # Called by the Pi Agent integration while the assistant starts up (llama.cpp loading the model, the
    # bridge's warm-up) and once more when it is ready: the cat shows the "loading" face meanwhile. The
    # integration repeats loading = true every few seconds; without a refresh for a minute it ends by itself.
    - action: pi_agent_loading
      variables:
        loading: bool
      then:
        - lambda: |-
            if (loading != id(pi_loading)) ESP_LOGI("kattio", "assistant %s", loading ? "loading" : "ready");
            id(pi_loading) = loading;
            id(pi_loading_refreshed) = millis();
        - script.execute: show_working
    # Called by the Pi Agent integration's noise filter: what was heard after the wake word (and after the cat's
    # remark about it) was the TV or the radio, not someone talking to the cat. End the conversation without a
    # word, also in chat mode.
    - action: pi_agent_dismiss
      then:
        - lambda: |-
            ESP_LOGI("kattio", "Background noise: ending the conversation quietly");
            id(listen_quietly) = false;
            id(multi_turn) = false;
            id(chat_mode) = false;
            id(face).set_mood(kattio::MOOD_BORED);
    # Called by the Pi Agent integration when the cat heard background noise and chose to say nothing: no answer
    # is played, but it listens once more (same conversation) for someone it knows. The integration screens
    # what it hears then; nothing, or the TV again, and the conversation ends.
    - action: pi_agent_listen
      then:
        - lambda: |-
            ESP_LOGI("kattio", "Background noise: listening quietly for a moment");
            id(listen_quietly) = true;

ota:
  - platform: esphome
    id: ota_esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Cat-in-a-Box 1 Fallback"
    password: !secret fallback_ap_password
  on_disconnect:
    - lambda: id(face).set_connected(false);

captive_portal:

# ---------------------------------------------------------------------------------------------
# The face
# ---------------------------------------------------------------------------------------------

spi:
  - id: spi_bus
    clk_pin: 7
    mosi_pin: 6

display:
  - platform: mipi_spi
    id: s3_box_lcd
    model: S3BOX
    invert_colors: false
    data_rate: 40MHz
    cs_pin: 5
    dc_pin: 4
    reset_pin:
      number: 48
      inverted: true
    update_interval: never
    auto_clear_enabled: false
    # The kattio_face component writes straight to the panel from its own task.
    lambda: |-
      // intentionally empty

kattio_face:
  id: face
  display_id: s3_box_lcd
  speaker_id: voice_out
  fps: 30
  resting_fps: 12
  sleep_timeout: 10min
  snap_one_in: ${snap_one_in}

output:
  - platform: ledc
    pin: GPIO47
    id: backlight_output

light:
  - platform: monochromatic
    id: backlight
    name: Screen
    icon: "mdi:television"
    entity_category: config
    output: backlight_output
    restore_mode: RESTORE_DEFAULT_ON
    default_transition_length: 600ms

# ---------------------------------------------------------------------------------------------
# Audio
# ---------------------------------------------------------------------------------------------

i2c:
  - id: i2c_bus
    scl: GPIO18
    sda: GPIO8

# The audio hardware (I2S bus, ES7210 microphone ADC, ES8311 speaker DAC) is a package chosen per box
# (audio/half-duplex.yaml or audio/full-duplex.yaml); both define `box_mic` and `box_speaker`.

microphone:
  # The voice assistant's own view of the microphone: muting it (end of turn) silences only what Home Assistant
  # hears; the wake word and turn detection keep listening to box_mic.
  - platform: mic_tap
    id: va_mic
    source: box_mic
    # When someone interrupts the cat, Home Assistant is passed what they said from where they began (replay)
    history: 8s

speaker:
  # EQ + limiter + lip-sync metering in front of it
  - platform: kattio_face
    id: voice_out
    output_speaker: box_speaker
    highpass: 170Hz
    presence: 3.0
    loudness_boost: 8.0

media_player:
  - platform: speaker
    name: None
    id: speaker_media_player
    # ES8311: 0.75 = 0 dB, above that is digital gain that clips. Keep the limiter the last word.
    volume_min: 0.45
    volume_max: 0.75
    volume_initial: 0.9  # first boot only; after that the last volume is remembered
    announcement_pipeline:
      speaker: voice_out
      format: FLAC
      sample_rate: 48000
      num_channels: 1  # the BOX-3 has a single speaker
    files:
      - id: timer_finished_sound
        file: https://github.com/esphome/home-assistant-voice-pe/raw/dev/sounds/timer_finished.flac
      - id: growl_sound
        file: sounds/growl.flac  # tools/make_growl.py
      - id: purr_sound
        file: sounds/purr.flac  # tools/make_purr.py
    on_announcement:
      - turn_stream.speaking:
      # Half duplex (mic and speaker take turns on the I2S bus): release the mic before playing.
      # Full duplex: keep listening, and listen for "Stop" while the cat talks.
      - if:
          condition:
            lambda: return id(full_duplex);
          then:
            - script.execute: listen_for_stop_only
          else:
            - if:
                condition:
                  microphone.is_capturing: box_mic
                then:
                  - micro_wake_word.stop:
      - if:
          condition:
            not:
              voice_assistant.is_running:
          then:
            - lambda: |-
                auto m = id(face).get_mood();
                if (m != kattio::MOOD_ALARM && m != kattio::MOOD_SNAP && m != kattio::MOOD_HAPPY)
                  id(face).set_mood(kattio::MOOD_SPEAK);
    on_idle:
      - turn_stream.not_speaking:
      - if:
          condition:
            not:
              voice_assistant.is_running:
          then:
            # In a conversation the cat stays attentive until after_run decides (listen again or end): no idle
            # blink between an answer and the next turn
            - lambda: |-
                if (id(face).get_mood() == kattio::MOOD_SPEAK)
                  id(face).set_mood(id(chat_mode) && !id(pi_working) ? kattio::MOOD_LISTEN : kattio::MOOD_IDLE);
            - script.execute: show_working
            # A background task's result was just announced in chat mode: carry on with the conversation
            - if:
                condition:
                  lambda: |-
                    bool resume = id(resume_after_announce) && id(chat_mode) && !id(pi_working) && !id(mute).state &&
                                  millis() - id(resume_since) < 10 * 60 * 1000;
                    id(resume_after_announce) = false;
                    return resume;
                then:
                  - lambda: id(multi_turn) = true;
                  - voice_assistant.start:
                      wake_word: !lambda return id(conv_wake_word);
                else:
                  - script.execute: start_wake_word

# ---------------------------------------------------------------------------------------------
# Wake words and voice assistant
# ---------------------------------------------------------------------------------------------

micro_wake_word:
  id: mww
  microphone: box_mic
  models:
    - model: ${wake_word_model}
      id: hey_kattio
    - model: ${wake_word_2_model}
      id: okay_kattio
    - model: https://github.com/kahrendt/microWakeWord/releases/download/stop/stop.json
      id: stop
      internal: true
  vad:
  on_wake_word_detected:
    - if:
        condition:
          lambda: return wake_word == "Stop";
        then:
          - script.execute: handle_stop_word
        else:
          - if:
              condition:
                voice_assistant.is_running:
              then:
                # A follow-up is listening (only "stop" counts there): not a new conversation
                - lambda: 'ESP_LOGD("kattio", "Ignoring \"%s\" during a follow-up", wake_word.c_str());'
              else:
                - if:
                    condition:
                      switch.is_on: timer_ringing
                    then:
                      - switch.turn_off: timer_ringing
                    else:
                      # Several boxes may have heard it: the arbiter lets only the closest one answer
                      - lambda: id(arbiter).claim(wake_word);

# Only one box answers a wake word: every box scores how loud it heard it, they compare over UDP
# and the loudest (= closest) one answers. Without other boxes around it answers immediately.
udp:
  id: arbiter_udp
  port: 18512

va_arbiter:
  id: arbiter
  udp_id: arbiter_udp
  microphone: box_mic
  key: !secret arbiter_key
  on_won:
    - lambda: |-
        id(wake_ms) = millis();
        // Whether to go on listening after each answer is the assistant's choice (Home Assistant's continue
        // conversation); the "Multi-turn" switch makes every assistant keep listening
        id(chat_mode) = id(multi_turn_on).state;
        id(multi_turn) = false;
        id(conv_wake_word) = wake_word;
        id(face).set_mood(kattio::MOOD_WAKE);
        // A wake word starts a new conversation: the Pi Agent's noise filter checks the first text of each
        // conversation (follow-ups and chat mode keep the conversation id)
        id(va).reset_conversation_id();
    - voice_assistant.start:
        wake_word: !lambda return wake_word;
  on_lost:
    # Another box is closer: perk the ears and keep listening for the wake word
    - lambda: id(face).notice();
    - script.execute: start_wake_word

# Turn detection (optional): while the cat listens for a request, a copy of the microphone goes to a turn detection
# service (the "Turn detection server" setting; wygate is one), which follows the speaker's voice and says when they
# are done, also when the TV keeps talking. The cat then mutes its microphone, so Home Assistant hears silence and
# ends the turn, and the TV after that point never reaches the transcript. No server set, or switch "Turn
# detection" off: Home Assistant's own end-of-speech detection alone.
turn_stream:
  id: turns
  microphone: box_mic
  server: ${turn_server}
  server_text: turn_server
  # The conversation ends it (end_conversation); this is only the safety net. Waiting for an answer (the agent may
  # think for a while) is neither listening nor speaking, and must not end the session.
  idle_timeout: 3min
  on_end_of_turn:
    - lambda: |-
        ESP_LOGI("kattio", "The speaker is done (%u): Home Assistant hears silence until the turn ends", reason);
        id(turn_muted) = true;
        // only HA's copy, from the live audio of now on: wake word and turn detection keep listening, and
        // words still being replayed after an interruption get through first
        id(va_mic).silence_now();
        id(face).set_mood(kattio::MOOD_THINK);
    - script.execute: turn_end_guard
  # Someone the cat knows talks to it while it speaks (full duplex; the service ignores the cat's own voice, the TV
  # and background talk): stop talking and listen, in the same conversation. Home Assistant gets the words from
  # where the interruption began (va_mic replays them), so the cat answers what was said. The service tells the
  # conversation agent where the answer was cut off.
  on_interrupt:
    - lambda: |-
        id(replay_ms) = speech_ms_ago + 400;  // a little before, so the first word is whole
        id(replay_since) = millis();
    - script.execute: interrupted

voice_assistant:
  id: va
  microphone: va_mic
  media_player: speaker_media_player
  micro_wake_word: mww
  noise_suppression_level: 2
  # No extra gain on the audio HA transcribes: the ES7210 already adds 33 dB (for the wake word across the
  # room), and automatic gain lifts the far-away TV in every pause between the user's words. Was 31dBFS / 2.0.
  auto_gain: 0dBFS
  volume_multiplier: 1.0
  # Timing log (switch "Timing log"): every pipeline step in ms since the turn started, so a slow or cut-off
  # answer can be pinned on STT, the conversation agent (LLM), TTS or the speaker. Pair with the speech
  # services' own timings (e.g. wygate's GET /timings) and the conversation agent's debug log.
  on_start:
    - lambda: |-
        id(va_t0) = millis();
        if (id(timing_log).state) {
          if (id(wake_ms) != 0 && millis() - id(wake_ms) < 5000)
            ESP_LOGI("timing", "------ turn starts, %u ms after the wake word", (unsigned) (millis() - id(wake_ms)));
          else
            ESP_LOGI("timing", "------ turn starts (%s)", id(multi_turn) ? "follow-up" : "push to talk");
        }
        id(wake_ms) = 0;
        id(first_progress) = true;
  on_stt_vad_start:
    - lambda: 'if (id(timing_log).state) ESP_LOGI("timing", "+%5u ms  speech started", (unsigned) (millis() - id(va_t0)));'
  on_intent_start:
    - lambda: 'if (id(timing_log).state) ESP_LOGI("timing", "+%5u ms  text sent to the conversation agent", (unsigned) (millis() - id(va_t0)));'
  on_intent_end:
    - lambda: 'if (id(timing_log).state) ESP_LOGI("timing", "+%5u ms  conversation agent done", (unsigned) (millis() - id(va_t0)));'
  on_tts_end:
    - lambda: 'if (id(timing_log).state) ESP_LOGI("timing", "+%5u ms  TTS audio ready: %s", (unsigned) (millis() - id(va_t0)), x.c_str());'
  on_listening:
    - lambda: 'if (id(timing_log).state) ESP_LOGI("timing", "+%5u ms  listening", (unsigned) (millis() - id(va_t0)));'
    - if:
        condition:
          switch.is_on: turn_detection
        then:
          - turn_stream.listen:
    # After an interruption: pass on what was said since it began
    - lambda: |-
        if (id(replay_since) != 0 && millis() - id(replay_since) < 4000)
          id(va_mic).replay(id(replay_ms) + (millis() - id(replay_since)));
        id(replay_since) = 0;
    - lambda: id(face).set_mood(kattio::MOOD_LISTEN);
    # Follow-up question (multi-turn): listen for "stop" alongside the request
    - if:
        condition:
          lambda: return id(multi_turn);
        then:
          - script.execute: listen_for_stop_only
          - micro_wake_word.start:
  on_stt_vad_end:
    - lambda: 'if (id(timing_log).state) ESP_LOGI("timing", "+%5u ms  speech ended", (unsigned) (millis() - id(va_t0)));'
    - script.execute: turn_over
    - lambda: id(face).set_mood(kattio::MOOD_THINK);
    - script.execute: release_mic_for_speaker
  on_stt_end:
    - lambda: 'if (id(timing_log).state) ESP_LOGI("timing", "+%5u ms  transcribed: %s", (unsigned) (millis() - id(va_t0)), x.c_str());'
    - script.execute: release_mic_for_speaker
    # "...let's talk" switches on chat mode: keep listening after every answer until "stop" or silence
    - lambda: |-
        std::string t = x;
        for (auto &ch : t) ch = (char) tolower((unsigned char) ch);
        // normalise typographic apostrophes
        size_t pos;
        while ((pos = t.find("\xE2\x80\x99")) != std::string::npos) t.replace(pos, 3, "'");
        static const char *const TRIGGERS[] = {"let's talk", "lets talk", "let us talk", "lad os snakke",
                                               "lad os tale"};
        for (auto *trig : TRIGGERS) {
          if (t.find(trig) != std::string::npos) {
            if (!id(chat_mode)) ESP_LOGI("kattio", "Chat mode on");
            id(chat_mode) = true;
          }
        }
        // Dismissal phrases end the conversation right away, without an answer ("bye-bye" -> "bye bye")
        for (auto &ch : t)
          if (ch == '-' || ch == ',' || ch == '.' || ch == '!') ch = ' ';
        static const char *const DISMISS[] = {"stop talking", "shut up", "bye bye", "go back to sleep",
                                              "hold mund", "hold op med at snakke", "farvel", "gå i seng"};
        for (auto *w : DISMISS) {
          if (t.find(w) != std::string::npos) {
            ESP_LOGI("kattio", "Dismissed (\"%s\"): ending the conversation", w);
            id(stop_conversation).execute();
            return;
          }
        }
        // Voice volume control, applied right away so the reply already plays at the new level
        static const char *const LOUDER[] = {"speak louder", "talk louder", "speak up", "louder please",
                                             "tal højere", "snak højere"};
        static const char *const SOFTER[] = {"lower your voice", "speak softer", "speak quieter", "talk quieter",
                                             "speak lower", "tal lavere", "snak lavere"};
        float step = 0;
        for (auto *w : LOUDER)
          if (t.find(w) != std::string::npos) step = 0.15f;
        for (auto *w : SOFTER)
          if (t.find(w) != std::string::npos) step = -0.15f;
        if (step != 0) {
          float v = std::max(0.05f, std::min(1.0f, id(speaker_media_player).volume + step));
          ESP_LOGI("kattio", "Voice volume %s -> %.2f", step > 0 ? "up" : "down", v);
          id(speaker_media_player).make_call().set_volume(v).perform();
        }
  on_intent_progress:
    - lambda: |-
        if (id(timing_log).state && id(first_progress)) {
          id(first_progress) = false;
          ESP_LOGI("timing", "+%5u ms  first streamed text from the agent%s", (unsigned) (millis() - id(va_t0)),
                   x.empty() ? "" : ", TTS streaming starts");
        } else if (id(timing_log).state && !x.empty()) {
          ESP_LOGI("timing", "+%5u ms  TTS streaming starts", (unsigned) (millis() - id(va_t0)));
        }
    - if:
        condition:
          # A non-empty x means a streaming TTS response has started
          lambda: return !x.empty();
        then:
          - script.execute: answer_on_its_way
  # The answer is there and its speech is being generated: "about to speak" until the first sound plays
  # (the face switches to speaking by itself then)
  on_tts_start:
    - lambda: 'if (id(timing_log).state) ESP_LOGI("timing", "+%5u ms  TTS started: %s", (unsigned) (millis() - id(va_t0)), x.c_str());'
    - script.execute: answer_on_its_way
  on_end:
    - lambda: 'if (id(timing_log).state) ESP_LOGI("timing", "+%5u ms  pipeline ended (audio may still be playing)", (unsigned) (millis() - id(va_t0)));'
    - script.execute: after_run
    - script.execute: turn_over
  on_error:
    - script.execute: turn_over
    - if:
        condition:
          lambda: return code != "duplicate_wake_up_detected";
        then:
          - lambda: |-
              if (code == "stt-no-text-recognized") {
                // Nobody said anything. In a follow-up that's just boring, otherwise confusing.
                id(face).set_mood(id(multi_turn) ? kattio::MOOD_BORED : kattio::MOOD_CONFUSED);
              } else {
                id(face).set_mood(kattio::MOOD_ERROR);
              }
              id(chat_mode) = false;
  on_client_connected:
    - lambda: id(face).set_connected(true);
    - script.execute: start_wake_word
  on_client_disconnected:
    - lambda: id(face).set_connected(false);
    - micro_wake_word.stop:
    - script.execute: turn_over
    - turn_stream.stop:
  on_timer_started:
    - script.execute: update_timer
  on_timer_updated:
    - script.execute: update_timer
  on_timer_cancelled:
    - script.execute: update_timer
  on_timer_tick:
    - script.execute: update_timer
  on_timer_finished:
    - switch.turn_on: timer_ringing

script:
  # The listening turn is over: stop streaming to the turn detection, and give Home Assistant's copy of the
  # microphone its sound back (the Mute switch mutes box_mic itself)
  - id: turn_over
    then:
      - turn_stream.listen_done:
      - script.stop: turn_end_guard
      - lambda: |-
          if (id(turn_muted)) {
            id(turn_muted) = false;
            id(va_mic).unsilence();
          }

  # After an end of turn, Home Assistant should hear the silence and end the turn within a second or two. If it
  # does not, end it from here, so the microphone is never left muted.
  - id: turn_end_guard
    mode: restart
    then:
      - delay: 5s
      - if:
          condition:
            lambda: return id(turn_muted);
          then:
            - lambda: ESP_LOGW("kattio", "Home Assistant did not end the turn after the speaker was done; stopping it");
            - voice_assistant.stop:
            - script.execute: turn_over

  # During a follow-up "stop" is listened for alongside the request. The wake word models are left alone:
  # which of them run is Home Assistant's choice (Wake word / Wake word 2), ESPHome saves it in flash, and HA
  # picks the assistant by matching the heard phrase against those settings. Switching them off here used to
  # lose the settings (a reboot or HA reconnect mid follow-up) or put back a stale copy over HA's choice.
  # Wake words heard during a follow-up are ignored in on_wake_word_detected instead.
  - id: listen_for_stop_only
    then:
      - micro_wake_word.enable_model: stop

  # (Re)start listening for the wake words HA has active ("stop" is internal and not saved in flash)
  - id: start_wake_word
    then:
      - micro_wake_word.disable_model: stop
      - if:
          condition:
            and:
              - switch.is_off: mute
              - not:
                  voice_assistant.is_running:
              - or:
                  - lambda: return id(full_duplex);
                  - not:
                      media_player.is_announcing:
              - not:
                  micro_wake_word.is_running:
          then:
            - micro_wake_word.start:

  # Half duplex: stop the wake word engine so the speaker can take the shared I2S bus
  - id: release_mic_for_speaker
    then:
      - if:
          condition:
            and:
              - lambda: return !id(full_duplex);
              - micro_wake_word.is_running:
          then:
            - micro_wake_word.stop:

  # Runs when an assist pipeline run ends (the TTS response may still be playing)
  - id: after_run
    mode: restart
    then:
      - wait_until:
          condition:
            media_player.is_announcing:
          timeout: 0.6s
      - wait_until:
          condition:
            and:
              - not:
                  media_player.is_announcing:
              - not:
                  speaker.is_playing: box_speaker
          timeout: 3min
      # Give the voice assistant a moment to continue the conversation (multi-turn)
      - delay: 400ms
      - if:
          condition:
            or:
              - voice_assistant.is_running:
              # interrupted: it is listening again in a moment
              - script.is_running: interrupted
          then:
            # The assistant asked a follow-up question: back to green/listening (on_listening)
            - lambda: id(multi_turn) = true;
          else:
            - if:
                condition:
                  lambda: return id(listen_quietly) && !id(mute).state;
                then:
                  # The cat stayed quiet about background noise: listen once more in the same conversation
                  - lambda: |-
                      id(listen_quietly) = false;
                      id(multi_turn) = true;
                  - voice_assistant.start:
                      wake_word: !lambda return id(conv_wake_word);
                else:
                  - if:
                      condition:
                        # While pi works in the background there is nothing to answer yet: show "working" instead,
                        # and pick the conversation up again once the result is announced (pi_agent_working)
                        lambda: return id(chat_mode) && !id(mute).state && !id(pi_working);
                      then:
                        # Chat mode: listen again (same conversation id, so the context carries over). Pass the
                        # wake word that started it, so HA keeps using the same assistant (pipeline 1 or 2).
                        - lambda: id(multi_turn) = true;
                        - voice_assistant.start:
                            wake_word: !lambda return id(conv_wake_word);
                      else:
                        - script.execute: end_conversation

  - id: answer_on_its_way
    then:
      - lambda: |-
          if (id(face).get_mood() != kattio::MOOD_SPEAK) id(face).set_mood(kattio::MOOD_READY);

  - id: end_conversation
    then:
      - turn_stream.stop:
      - lambda: |-
          id(multi_turn) = false;
          // Chat mode survives a background task, so the conversation continues after its result
          if (!id(pi_working)) id(chat_mode) = false;
          auto m = id(face).get_mood();
          if (m == kattio::MOOD_SPEAK || m == kattio::MOOD_LISTEN || m == kattio::MOOD_THINK ||
              m == kattio::MOOD_WAKE || m == kattio::MOOD_READY) {
            id(face).set_mood(kattio::MOOD_IDLE);
          }
      - script.execute: show_working
      - script.execute: start_wake_word

  # "Working" face while pi is busy in the background, unless the cat is doing something else right now
  - id: show_working
    then:
      - lambda: |-
          auto m = id(face).get_mood();
          bool busy = id(va).is_running() || id(speaker_media_player).state == media_player::MEDIA_PLAYER_STATE_ANNOUNCING;
          bool resting = m == kattio::MOOD_IDLE || m == kattio::MOOD_SLEEP || m == kattio::MOOD_BORED ||
                         m == kattio::MOOD_CONFUSED || m == kattio::MOOD_SPEAK;
          // Working beats loading; both only replace a resting face, never a conversation
          if (id(pi_working) && !busy && (resting || m == kattio::MOOD_LOADING)) {
            id(face).set_mood(kattio::MOOD_WORK);
          } else if (!id(pi_working) && id(pi_loading) && !busy && (resting || m == kattio::MOOD_WORK)) {
            id(face).set_mood(kattio::MOOD_LOADING);
          } else if ((!id(pi_working) && m == kattio::MOOD_WORK) || (!id(pi_loading) && m == kattio::MOOD_LOADING)) {
            id(face).set_mood(kattio::MOOD_IDLE);
          }

  # "Stop" heard during a follow-up: end the conversation with a sigh
  - id: handle_stop_word
    then:
      - if:
          condition:
            switch.is_on: timer_ringing
          then:
            - switch.turn_off: timer_ringing
          else:
            - script.execute: stop_conversation

  # Interrupted while talking: stop, and listen again in the same conversation (same assistant, same id)
  - id: interrupted
    mode: single
    then:
      - lambda: |-
          ESP_LOGI("kattio", "Interrupted: listening");
          id(multi_turn) = true;
          id(face).set_mood(kattio::MOOD_LISTEN);
      - voice_assistant.stop:
      - if:
          condition:
            media_player.is_announcing:
          then:
            - media_player.stop:
                announcement: true
      - wait_until:
          condition:
            not:
              voice_assistant.is_running:
          timeout: 2s
      - voice_assistant.start:
          wake_word: !lambda return id(conv_wake_word);

  # "Stop", or a dismissal like "bye bye" / "go back to sleep": end the conversation (and multi-turn) now
  - id: stop_conversation
    then:
      - lambda: |-
          id(listen_quietly) = false;
          id(multi_turn) = false;
          id(chat_mode) = false;
          id(face).set_mood(kattio::MOOD_BORED);
      - voice_assistant.stop:
      # Full duplex: "Stop" can come while the cat is talking
      - if:
          condition:
            media_player.is_announcing:
          then:
            - media_player.stop:
                announcement: true
      - wait_until:
          condition:
            not:
              voice_assistant.is_running:
          timeout: 3s
      - script.execute: start_wake_word

  # Screen tap: stop alarms, interrupt the cat while it talks, or pet it
  - id: on_tap
    then:
      - if:
          condition:
            switch.is_on: timer_ringing
          then:
            - switch.turn_off: timer_ringing
          else:
            - if:
                condition:
                  lambda: return id(face).get_mood() == kattio::MOOD_SPEAK || id(face).get_mood() == kattio::MOOD_READY;
                then:
                  - lambda: |-
                      id(multi_turn) = false;
                      id(chat_mode) = false;
                  - voice_assistant.stop:
                  - media_player.stop:
                      announcement: true
                  - lambda: id(face).set_mood(kattio::MOOD_BORED);
                else:
                  - script.execute: pet

  # Pet the cat. Mostly it loves it and purrs, but now and then it snaps: growl and claw marks (snap_one_in)
  - id: pet
    then:
      - if:
          condition:
            lambda: return id(face).poke();
          then:
            - media_player.speaker.play_on_device_media_file:
                media_file: growl_sound
                announcement: true
          else:
            # Happy: purr (keep purring through more strokes instead of restarting it)
            - if:
                condition:
                  and:
                    - lambda: return id(face).get_mood() == kattio::MOOD_HAPPY;
                    - not:
                        media_player.is_announcing:
                then:
                  - media_player.speaker.play_on_device_media_file:
                      media_file: purr_sound
                      announcement: true

  # Push to talk
  - id: push_to_talk
    then:
      - if:
          condition:
            and:
              - switch.is_off: mute
              - not:
                  voice_assistant.is_running:
          then:
            - if:
                condition:
                  media_player.is_announcing:
                then:
                  - media_player.stop:
                      announcement: true
            - micro_wake_word.stop:
            - lambda: |-
                id(chat_mode) = id(multi_turn_on).state;
                id(multi_turn) = false;
                id(conv_wake_word) = "";  // push to talk always uses the first assistant
                id(face).set_mood(kattio::MOOD_WAKE);
                id(va).reset_conversation_id();
            - voice_assistant.start:

  # Timer progress bar along the bottom of the screen
  - id: update_timer
    then:
      - lambda: |-
          const auto &timers = id(va).get_timers();
          bool found = false;
          float frac = 0;
          bool running = false;
          uint32_t best = UINT32_MAX;
          for (const auto &t : timers) {
            if (t.seconds_left < best || (t.is_active && !running)) {
              best = t.seconds_left;
              frac = t.total_seconds > 0 ? (float) t.seconds_left / (float) t.total_seconds : 0;
              running = t.is_active;
              found = true;
            }
          }
          id(face).set_timer(found, frac, running);

globals:
  # Timing log: when the current turn started / the wake word was heard (millis)
  - id: va_t0
    type: uint32_t
    initial_value: "0"
  - id: wake_ms
    type: uint32_t
    initial_value: "0"
  - id: first_progress
    type: bool
    initial_value: "true"
  # Wake word phrase that started the current conversation (picks the HA assistant for follow-ups)
  - id: conv_wake_word
    type: std::string
    restore_value: false
    initial_value: '""'
  # the turn detection muted the microphone (turn_stream on_end_of_turn) until the listening turn is over
  - id: turn_muted
    type: bool
    restore_value: false
    initial_value: "false"
  # an interruption: how far back its words began (ms) when it came (millis, 0: none pending)
  - id: replay_ms
    type: uint32_t
    initial_value: "0"
  - id: replay_since
    type: uint32_t
    initial_value: "0"
  # pi_agent_listen: after this run, listen once more without having said anything
  - id: listen_quietly
    type: bool
    initial_value: "false"
  - id: chat_mode
    type: bool
    restore_value: false
    initial_value: "false"
  # pi (Pi Agent integration) is working on a task in the background
  - id: pi_working
    type: bool
    restore_value: false
    initial_value: "false"
  - id: pi_loading
    type: bool
    initial_value: "false"
  - id: pi_loading_refreshed
    type: uint32_t
    initial_value: "0"
  - id: pi_working_since
    type: uint32_t
    restore_value: false
    initial_value: "0"
  - id: resume_after_announce
    type: bool
    restore_value: false
    initial_value: "false"
  - id: resume_since
    type: uint32_t
    restore_value: false
    initial_value: "0"
  - id: multi_turn
    type: bool
    restore_value: false
    initial_value: "false"

# ---------------------------------------------------------------------------------------------
# Controls
# ---------------------------------------------------------------------------------------------

touchscreen:
  - platform: gt911
    id: touch
    i2c_id: i2c_bus
    interrupt_pin: GPIO3
    display: s3_box_lcd
    on_touch:
      - script.execute: on_tap

interval:
  # Last resort for a background task that was never reported done (Home Assistant down, ...). Normally the
  # bridge stops a task after 10 min and the pi agent integration checks on it every 3 min, so this never fires.
  - interval: 30s
    then:
      - if:
          condition:
            lambda: return id(pi_working) && millis() - id(pi_working_since) > 15 * 60 * 1000;
          then:
            - lambda: |-
                ESP_LOGW("kattio", "pi never reported back; leaving the working state");
                id(pi_working) = false;
            - script.execute: show_working
      # "Loading" is refreshed every few seconds while the assistant starts up: without a refresh, end it
      - if:
          condition:
            lambda: return id(pi_loading) && millis() - id(pi_loading_refreshed) > 60 * 1000;
          then:
            - lambda: |-
                ESP_LOGW("kattio", "no loading update for a minute; leaving the loading state");
                id(pi_loading) = false;
            - script.execute: show_working

# Why and when the box last restarted (crashes show up here)
debug:
  update_interval: 5min

sensor:
  - platform: uptime
    name: Uptime
    entity_category: diagnostic
    update_interval: 60s

binary_sensor:
  # Top-left button: stop a ringing timer; hold 10s for factory reset
  - platform: gpio
    pin:
      number: GPIO0
      ignore_strapping_warning: true
      mode: INPUT_PULLUP
      inverted: true
    id: top_button
    internal: true
    on_multi_click:
      - timing:
          - ON for at least 50ms
          - OFF for at least 50ms
        then:
          - if:
              condition:
                switch.is_on: timer_ringing
              then:
                - switch.turn_off: timer_ringing
              else:
                - script.execute: push_to_talk
      - timing:
          - ON for at least 10s
        then:
          - button.press: factory_reset_btn
  # The red "home" circle under the screen: push to talk
  - platform: gt911
    id: home_button
    gt911_id: touch
    index: 0
    internal: true
    on_press:
      - script.execute: push_to_talk
  # Dim the screen while the cat sleeps
  - platform: template
    id: sleeping
    name: Sleeping
    icon: "mdi:sleep"
    lambda: return id(face).is_sleeping();
    on_press:
      - light.turn_on:
          id: backlight
          brightness: 35%
          transition_length: 3s
    on_release:
      - light.turn_on:
          id: backlight
          brightness: 100%
          transition_length: 300ms

# Where the turn detection service runs: "host" or "host:port" (IP address or hostname). Empty: turn detection off.
text:
  - platform: template
    id: turn_server
    name: Turn detection server
    icon: "mdi:server-network"
    entity_category: config
    mode: text
    optimistic: true
    restore_value: true
    initial_value: ${turn_server}
    max_length: 63

button:
  - platform: factory_reset
    id: factory_reset_btn
    internal: true
  - platform: template
    name: Pet the cat
    icon: "mdi:cat"
    on_press:
      - script.execute: pet

switch:
  - platform: gpio
    name: Speaker Enable
    pin:
      number: GPIO46
      ignore_strapping_warning: true
    restore_mode: RESTORE_DEFAULT_ON
    entity_category: config
    disabled_by_default: true
  - platform: template
    name: Mute
    id: mute
    icon: "mdi:microphone-off"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    entity_category: config
    on_turn_on:
      - microphone.mute: box_mic
      - micro_wake_word.stop:
      - lambda: id(face).set_muted(true);
    on_turn_off:
      - microphone.unmute: box_mic
      - lambda: id(face).set_muted(false);
      - script.execute: start_wake_word
  # Turn detection by the turn detection service (follows the speaker's voice, ends the turn when they are done
  # even with the TV on). Off: Home Assistant's own end-of-speech detection alone.
  - platform: template
    name: Turn detection
    id: turn_detection
    icon: "mdi:account-voice"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    entity_category: config
  # The device's own chat mode: every assistant keeps listening after each answer (until silence or "stop"). Better
  # left off, with the choice made per assistant (e.g. Pi Agent "Keep the conversation going"): Home Assistant then
  # tells the device to listen on. When off, saying "let's talk" switches it on for one conversation.
  - platform: template
    name: Multi-turn
    id: multi_turn_on
    icon: "mdi:message-reply-text"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    entity_category: config
  # Logs the timing of every pipeline step and when the speaker runs out of audio (tag "timing")
  - platform: template
    name: Timing log
    id: timing_log
    icon: "mdi:timer-outline"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    entity_category: diagnostic
    on_turn_on:
      - lambda: id(voice_out).set_timing_log(true);
    on_turn_off:
      - lambda: id(voice_out).set_timing_log(false);
  - platform: template
    name: Voice enhancer
    id: voice_enhancer
    icon: "mdi:tune-vertical"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    entity_category: config
    on_turn_on:
      - lambda: id(voice_out).set_enabled(true);
    on_turn_off:
      - lambda: id(voice_out).set_enabled(false);
  - platform: template
    id: timer_ringing
    optimistic: true
    internal: true
    restore_mode: ALWAYS_OFF
    on_turn_off:
      - lambda: |-
          id(speaker_media_player)
            ->make_call()
            .set_command(media_player::MediaPlayerCommand::MEDIA_PLAYER_COMMAND_REPEAT_OFF)
            .set_announcement(true)
            .perform();
          id(speaker_media_player)->set_playlist_delay_ms(speaker::AudioPipelineType::ANNOUNCEMENT, 0);
      - media_player.stop:
          announcement: true
      - lambda: id(face).set_mood(kattio::MOOD_IDLE);
    on_turn_on:
      - micro_wake_word.stop:
      - lambda: |-
          id(face).set_mood(kattio::MOOD_ALARM);
          id(speaker_media_player)
            ->make_call()
            .set_command(media_player::MediaPlayerCommand::MEDIA_PLAYER_COMMAND_REPEAT_ONE)
            .set_announcement(true)
            .perform();
          id(speaker_media_player)->set_playlist_delay_ms(speaker::AudioPipelineType::ANNOUNCEMENT, 1000);
      - media_player.speaker.play_on_device_media_file:
          media_file: timer_finished_sound
          announcement: true
      - delay: 15min
      - switch.turn_off: timer_ringing

select:
  # Wake word sensitivity (probability cutoff of "Hey Kattio"): more sensitive = more false wakes
  - platform: template
    name: Wake word sensitivity
    id: wake_word_sensitivity
    icon: mdi:ear-hearing
    entity_category: config
    optimistic: true
    restore_value: true
    initial_option: Moderately sensitive
    options:
      - Slightly sensitive
      - Moderately sensitive
      - Very sensitive
    on_value:
      - lambda: |-
          static const uint8_t CUTOFFS[] = {250, 240, 224};  // 0.98 / 0.94 / 0.88
          id(hey_kattio).set_probability_cutoff(CUTOFFS[i]);
          id(okay_kattio).set_probability_cutoff(CUTOFFS[i]);

number:
  - platform: template
    name: Loudness boost
    id: loudness_boost
    icon: "mdi:volume-plus"
    entity_category: config
    unit_of_measurement: dB
    min_value: 0
    max_value: 12
    step: 1
    initial_value: 8
    optimistic: true
    restore_value: true
    on_value:
      - lambda: id(voice_out).set_boost_db(x);
  - platform: template
    name: Sleep after
    id: sleep_after
    icon: "mdi:sleep"
    entity_category: config
    unit_of_measurement: min
    min_value: 1
    max_value: 120
    step: 1
    initial_value: 10
    optimistic: true
    restore_value: true
    on_value:
      - lambda: id(face).set_sleep_timeout((uint32_t) (x * 60000));
  - platform: template
    name: Snaps at 1 in N pets
    id: snap_one_in
    icon: "mdi:paw"
    entity_category: config
    mode: box
    min_value: 0
    max_value: 100
    step: 1
    initial_value: ${snap_one_in}
    optimistic: true
    restore_value: true
    on_value:
      - lambda: id(face).set_snap_one_in((uint16_t) x);

text_sensor:
  - platform: debug
    reset_reason:
      name: Reset reason
      entity_category: diagnostic
  - platform: template
    name: Mood
    icon: "mdi:cat"
    entity_category: diagnostic
    update_interval: 1s
    lambda: |-
      static const char *const NAMES[] = {"booting", "idle", "sleeping", "waking", "listening", "thinking",
                                          "speaking", "bored", "error", "muted", "offline", "alarm",
                                          "happy", "confused", "snapping", "working", "answering", "loading"};
      auto m = (unsigned) id(face).get_mood();
      return std::string(m < sizeof(NAMES) / sizeof(NAMES[0]) ? NAMES[m] : "?");
